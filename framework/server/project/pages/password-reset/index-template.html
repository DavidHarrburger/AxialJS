<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Mot de passe oublié | </title>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Changer mon mot de passe">

    <meta property="og:url"                 content="https://mysite.fr/account/password/reset" />
    <meta property="og:type"                content="website" />
    <meta property="og:title"               content="Mot de passe oublié | " />
    <meta property="og:description"         content="Changer mon mot de passe" />
    <meta property="og:image"               content="" />
    <meta property="og:image:width"         content="" />
    <meta property="og:image:height"        content="" />
    
    <link rel="icon" type="image/x-icon" href="../../assets/favicon/favicon.ico">

    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    
<!--$$$C-->

    <div id="axialBackgroundLayer" class="axial_layer_base axial_background_layer">
        <div class="axial_reset_page-background"></div>
    </div>
    
    <div id="axialMainLayer" class="axial_main_layer">
        <main class="axial_main">
            <section class="axial_section">
                <div class="axial_section_content">
                    <div class="axial_reset_content">
                        <div class="axial_reset_content-left">
                            <a class="axial_reset_reset-link axial_reset_logo-left" href="../../" target="_self">
                                <img class="axial_reset_logo-img" alt="logo" src="../../assets/logos/logo.png">
                            </a>
                        </div>
                        <div class="axial_reset_content-right">
                            <div class="axial_reset_holder">
                                <a class="axial_reset_logo-link axial_reset_logo-right" href="../../" target="_self">
                                    <img class="axial_reset_logo-img" alt="logo" src="../../assets/logos/logo.png">
                                </a>
                                <h1>Changer mon mot de passe</h1>
                                <p class="axial_resetter_content-p">Renseignez l'email de votre compte et suivez les instructions pour mettre à jour votre mot de passe.</p>
                                <axial-auth-resetter id="reset"></axial-auth-resetter>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="axialIntroLayer" class="axial_layer_base axial_intro_layer"></div>

    <div id="axialPopupLayer" class="axial_layer_base axial_popup_layer">
        <div id="axialPopupObfuscator" class="axial_popup_obfuscator"></div>
    </div>
    <div id="axialNotificationLayer" class="axial_layer_base axial_notification_layer"></div>
    <div id="axialOverlayLayer" class="axial_layer_base axial_overlay_layer"></div>
    <div id="axialTooltipLayer" class="axial_layer_base axial_tooltip_layer"></div>
    <div id="axialTransitionLayer" class="axial_layer_base axial_transition_layer"></div>
    
    <script src="./application.js" defer></script>
    
</body>
</html>
