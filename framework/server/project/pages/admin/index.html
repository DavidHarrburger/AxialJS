<!-- AxialArchiveOverlay -->
<template id="axial-archive-overlay-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_archive_overlay-holder">
        <div class="axial_archive_overlay-header">
            
            <div class="axial_archive_overlay-icon">
                &#9888;
            </div>
            
            <div class="axial_archive_overlay-title">Attention</div>
        </div>
        <div class="axial_archive_overlay-content">
            L'archivage des données rend les données invisibles mais ne les suprrime pas. Néanmoins la fonction de restauration de l'affichage n'existe pas encore et doit être opérée manuellement par David.
        </div>
        <div class="axial_archive_overlay-actions">
            <axial-button id="cancel" axial-text="Annuler" axial-theme="#232323" axial-color="#ffffff">
                <i slot="axial-icon" class="fa-color fa-solid fa-arrow-left"></i>
            </axial-button>
            <axial-button id="confirm" axial-text="Archiver" axial-theme="#cc0000">
                <i slot="axial-icon" class="fa-color fa-solid fa-box-archive"></i>
            </axial-button>
        </div>
    </div>
</template>

<!-- AxialConsentOverlay -->
<template id="axial-consent-overlay-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_consent_overlay-holder">
        <div class="axial_consent_overlay-header">
            <div class="axial_consent_overlay-cookie">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

                </svg>
            </div>
            <div class="axial_consent_overlay-title">Votre consentement</div>
        </div>
        <div class="axial_consent_overlay-content">
            <p class="axial_consent_overlay-p">En naviguant sur ce site, vous acceptez l'utilisation des cookies et API de stockage essentiels à son bon fonctionnement.</p>
            <p class="axial_consent_overlay-p">Pour en savoir davantage, consultez notre <a id="privacy" class="axial_consent_overlay-link" href="./politique-de-confidentialite/" target="_self">politique-de-confidentialite</a></p>
        </div>
        <div class="axial_consent_overlay-actions">
            <!--<axial-button id="decline" axial-text="Je refuse"></axial-button>-->
            <axial-button id="accept" axial-text="J'ai compris"></axial-button>
        </div>
    </div>
</template>
