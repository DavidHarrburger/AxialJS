<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Vérification de votre identité</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <link rel="icon" type="image/x-icon" href="../../assets/favicon/favicon.ico">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <!--$$$ COMPONENTS_ENTRY_POINT $$$-->
    <!-- BUTTON PACKAGE -->
    <!-- ./button/AxialButton -->
    <template id="axial-button-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="background" class="axial_button-background"></div>
        <div id="foreground" class="axial_button-foreground"></div>
        <div id="content" class="axial_button-content">
            <div id="icon" class="axial_button-icon">
                <slot id="iconSlot" name="axial-icon"></slot>
            </div>
            <div id="label" class="axial_button-label"></div>
        </div>
    </template>
    <!-- ./button/AxialServiceButton -->
    <template id="axial-service-button-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="background" class="axial_service_button-background"></div>
        <div id="foreground" class="axial_service_button-foreground"></div>
        <div id="content" class="axial_service_button-content">
            <div id="icon" class="axial_service_button-icon">
                <div id="indicator" class="axial_service_button-indicator"></div>
            </div>
            <div id="label" class="axial_service_button-label"></div>
        </div>
    </template>
    <!-- ./button/AxialBurgerButton -->
    <template id="axial-burger-button-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="background" class="axial_burger_button-background"></div>
        <div id="foreground" class="axial_burger_button-foreground"></div>
        <div id="lines" class="axial_burger_button-lines">
            <div id="top" class="axial_burger_button-line axial_burger_button-top"></div>
            <div id="middle" class="axial_burger_button-line axial_burger_button-middle"></div>
            <div id="bottom" class="axial_burger_button-line axial_burger_button-bottom"></div>
        </div>
        <div id="border" class="axial_burger_button-border"></div>
    </template>
    <!-- ./buttons/AxialToggleButtonGroup -->
    <template id="axial-toggle-button-group-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="holder" class="axial_toggle_button_group-holder">
            <slot id="slot" name="axial-toggles"></slot>
        </div>
    </template>
    <!-- ./buttons/AxialToggleRadio -->
    <template id="axial-toggle-radio-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="border" class="axial_toggle_radio-border">
            <div id="circle" class="axial_toggle_radio-circle"></div>
        </div>
        <div id="label" class="axial_toggle_radio-label">Label</div>
    </template>
    <!-- APPLICATION PACKAGE -->
    <!-- ./application/AxialNotifier -->
    <template id="axial-notifier-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="holder" class="axial_notifier_holder">
            <div id="content" class="axial_notifier_content"></div>
        </div>
    </template>
    <!-- ./application/AxialInformationBar -->
    <template id="axial-information-bar-template">
        <link rel="stylesheet" href="./styles.css">
        <div id="holder" class="axial_information_bar-holder">
            <div id="content" class="axial_information_bar-content">
                <slot name="axial-content" id="slot"></slot>
            </div>
            <div id="closer" class="axial_information_bar-closer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="axial_information_bar-svg">
                    <path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
                </svg>
            </div>
        </div>
    </template>
    <!-- ./application/AxialConsentOverlay -->
    <template id="axial-consent-overlay-template">
        <link rel="stylesheet" href="./styles.css">
        <div class="axial_consent_overlay-holder">
            <div class="axial_consent_overlay-header">
                <div class="axial_consent_overlay-cookie">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                        <path fill="#fff" d="M257.5 27.6c-.8-5.4-4.9-9.8-10.3-10.6c-22.1-3.1-44.6 .9-64.4 11.4l-74 39.5C89.1 78.4 73.2 94.9 63.4 115L26.7 190.6c-9.8 20.1-13 42.9-9.1 64.9l14.5 82.8c3.9 22.1 14.6 42.3 30.7 57.9l60.3 58.4c16.1 15.6 36.6 25.6 58.7 28.7l83 11.7c22.1 3.1 44.6-.9 64.4-11.4l74-39.5c19.7-10.5 35.6-27 45.4-47.2l36.7-75.5c9.8-20.1 13-42.9 9.1-64.9c-.9-5.3-5.3-9.3-10.6-10.1c-51.5-8.2-92.8-47.1-104.5-97.4c-1.8-7.6-8-13.4-15.7-14.6c-54.6-8.7-97.7-52-106.2-106.8zM208 144a32 32 0 1 1 0 64 32 32 0 1 1 0-64zM144 336a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm224-64a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/>
                    </svg>
                </div>
                <div class="axial_consent_overlay-title">Votre consentement</div>
            </div>
            <div class="axial_consent_overlay-content">
                <p class="axial_consent_overlay-p">En naviguant sur ce site, vous acceptez l'utilisation des cookies et API de stockage essentiels à son bon fonctionnement.</p>
                <p class="axial_consent_overlay-p">Pour en savoir davantage, consultez notre <a id="privacy" class="axial_consent_overlay-link" href="./politique-de-confidentialite/" target="_self">politique-de-confidentialite</a></p>
            </div>
            <div class="axial_consent_overlay-actions">
                <!--<axial-button id="decline" axial-text="Je refuse"></axial-button>-->
                <axial-button id="accept" axial-text="J'ai compris"></axial-button>
            </div>
        </div>
    </template>
    <!-- ./application/AxialDeletionOverlay -->
    <template id="axial-deletion-overlay-template">
        <link rel="stylesheet" href="./styles.css">
        <div class="axial_deletion_overlay-holder">
            <div class="axial_deletion_overlay-header">
                <div class="axial_deletion_overlay-icon">&#9888;</div>
                <div class="axial_deletion_overlay-title">Attention</div>
            </div>
            <div class="axial_deletion_overlay-content">
                La suppression des données est irreversible.
            </div>
            <div class="axial_deletion_overlay-actions">
                <axial-button id="cancel" axial-text="Annuler" axial-theme="#232323" axial-color="#ffffff">
                    <i slot="axial-icon" class="fa-color fa-solid fa-arrow-left"></i>
                </axial-button>
                <axial-button id="confirm" axial-text="Supprimer" axial-theme="#cc0000">
                    <i slot="axial-icon" class="fa-color fa-regular fa-trash-can"></i>
                </axial-button>
            </div>
        </div>
    </template>
    
    <!-- AUTH PACKAGE -->
    <!-- ./auth/AxialAuthVerifyer -->
    <template id="axial-auth-verifyer-template">
        <link rel="stylesheet" href="./styles.css">
        <form id="form" class="axial_auth_verifyer-form" autocomplete="off">
            <div class="axial_auth_verifyer-question">Recevoir mon code par :</div>
            <axial-toggle-button-group id="group">
                <axial-toggle-radio slot="axial-toggles" axial-text="SMS" axial-value="sms"></axial-toggle-radio>
                <axial-toggle-radio slot="axial-toggles" axial-text="Email" axial-value="email"></axial-toggle-radio>
            </axial-toggle-button-group>

            <axial-service-button id="sendButton" axial-text="Recevoir mon code"></axial-service-button>

            <div class="axial_auth_verifyer-recipient" id="recipient"></div>
            
            <div class="axial_auth_verifyer-inputs" id="holder">
                <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_1" value="" required minlength="1" maxlength="1" autocomplete="off">
                <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_2" value="" required minlength="1" maxlength="1" autocomplete="off">
                <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_3" value="" required minlength="1" maxlength="1" autocomplete="off">
                <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_4" value="" required minlength="1" maxlength="1" autocomplete="off">
                <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_5" value="" required minlength="1" maxlength="1" autocomplete="off">
                <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_6" value="" required minlength="1" maxlength="1" autocomplete="off">
            </div>
            
            <div class="axial_auth_verifyer-divider"></div>
            
        </form>
    </template>
    
    <div id="axialBackgroundLayer" class="axial_layer_base axial_background_layer">
        <div class="axial_verification_page-background"></div>
    </div>
    
    <div id="axialMainLayer" class="axial_main_layer">
        <main class="axial_main">
            <section class="axial_section">
                <div class="axial_section_content">
                    <div class="axial_verification_content">
                        <div class="axial_verification_content-left">
                            <a class="axial_verification_logo-link axial_verification_logo-left" href="../../" target="_self">
                                <img class="axial_verification_logo-img" alt="logo" src="../../assets/logos/logo.png">
                            </a>
                        </div>
                        <div class="axial_verification_content-right">
                            <div class="axial_verification_holder">
                                <a class="axial_verification_logo-link axial_verification_logo-right" href="../../" target="_self">
                                    <img class="axial_verification_logo-img" alt="logo" src="../../assets/logos/logo.png">
                                </a>
                                <h1>Vérifier votre identité</h1>
                                <p class="axial_verification_content-p">Pour votre sécurité, l'authentification à 2 facteurs est obligatoire sur ce site.</p>
                                <axial-auth-verifyer id="verifyer"></axial-auth-verifyer>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="axialIntroLayer" class="axial_layer_base axial_intro_layer"></div>
    <div id="axialPopupLayer" class="axial_layer_base axial_popup_layer">
        <div id="axialPopupObfuscator" class="axial_popup_obfuscator"></div>
    </div>
    <div id="axialMediasLayer" class="axial_layer_base axial_medias_layer"></div>
    <div id="axialNotificationLayer" class="axial_layer_base axial_notification_layer">
        <axial-notifier id="axialNotifier"></axial-notifier>
    </div>
    <div id="axialOverlayLayer" class="axial_layer_base axial_overlay_layer">
        <div id="axialOverlayObfuscator" class="axial_overlay_obfuscator"></div>
        <axial-consent-overlay id="axialConsentOverlay"></axial-consent-overlay>
        <axial-deletion-overlay id="axialDeletionOverlay"></axial-deletion-overlay>
    </div>
    <div id="axialTooltipLayer" class="axial_layer_base axial_tooltip_layer"></div>
    <div id="axialTransitionLayer" class="axial_layer_base axial_transition_layer"></div>
    
    <script src="./application.js" defer></script>
    
</body>
</html>
