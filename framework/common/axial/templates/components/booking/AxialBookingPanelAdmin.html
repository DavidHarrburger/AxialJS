<!-- AxialBookingPanelAdmin -->
<template id="axial-booking-panel-admin-template">
    <link rel="stylesheet" href="./styles.css">

    <div id="initState" class="axial_booking_panel_admin-state axial_booking_panel_admin-state_init">
        <div class="axial_booking_panel-header">Informations générales</div>
        <div id="count" class="axial_booking_panel_admin-count"></div>
    </div>
    
    <div id="addState" class="axial_booking_panel_admin-state axial_booking_panel_admin-state_add">
        <div id="addHeader" class="axial_booking_panel-header">Date</div>

        <axial-toggle-button-group id="kindGroup">
            <axial-toggle-radio axial-text="Créer un RDV pour un client" axial-value="event" slot="axial-toggles"></axial-toggle-radio>
            <axial-toggle-radio axial-text="Rendre ce créneau indisponible" axial-value="ghost" slot="axial-toggles"></axial-toggle-radio>
        </axial-toggle-button-group>
        <div id="eventHolder" class="axial_booking_panel_admin-event_holder">
            <div class="axial_booking_panel-divider">Pour quel client ?</div>
            <div class="ax_frow ax_fg20">
                <axial-button id="userSelectButton" axial-text="Sélectionner un client existant"></axial-button>
                <axial-button id="userCreateButton" axial-text="Créer un nouveau client" style="display: none;"></axial-button>
            </div>
            <div id="selectedClient" class="axial_booking_panel_admin-client_name"></div>
            <div id="geoHolder" class="axial_booking_panel_admin-geo_holder">
                <div class="axial_booking_panel-divider">Lieu du RDV</div>
                <!--<div class="axial_booking_panel-label">Prenez bien soin de vérifier l'adresse que vous nous communiquer.</div>-->
                <div class="axial_booking_panel-row">
                    <div class="axial_booking_panel-item">
                        <label for="address" class="axial_booking_panel-label">Adresse</label>
                        <input id="address" name="address" required autocomplete="address-line1" minlength="8" maxlength="256">
                    </div>
                </div>
                <div class="axial_booking_panel-row">
                    <div class="axial_booking_panel-item">
                        <label for="zip" class="axial_booking_panel-label">Code postal</label>
                        <input id="zip" required autocomplete="postal-code" minlength="4" maxlength="5">
                    </div>
                    <div class="axial_booking_panel-item">
                        <label for="city" class="axial_booking_panel-label">Ville</label>
                        <input id="city" required autocomplete="address-level2" minlength="3" maxlength="64">
                    </div>
                </div>
            </div>
        </div>
        <!--<div class="axial_spacer"></div>-->
        <axial-service-button id="validateButton" axial-text="Valider"></axial-service-button>
    </div>
    
    <div id="infoState" class="axial_booking_panel_admin-state axial_booking_panel_admin-state_info">
        <div class="axial_booking_panel-header">Détail</div>
        <div id="detailMain"></div>
        <div id="detailSub"></div>
    </div>
</template>
