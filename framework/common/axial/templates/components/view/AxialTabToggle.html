<!-- AxialTabToggle -->
<template id="axial-tab-toggle-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_tab_button-background"></div>
    <div id="foreground" class="axial_tab_button-foreground"></div>
    <div id="content" class="axial_tab_button-content">
        <div id="icon" class="axial_toggle_button-icon">
            <slot id="iconSlot" name="axial-icon"></slot>
        </div>
        <div id="iconToggle" class="axial_toggle_button-icontoggle">
            <slot id="iconToggleSlot" name="axial-icon-toggle"></slot>
        </div>
        <div id="label" class="axial_tab_button-label"></div>
    </div>
    <div id="dropleft" class="axial_tab_toggle-dropleft"></div>
    <div id="dropright" class="axial_tab_toggle-dropright"></div>
</template>
