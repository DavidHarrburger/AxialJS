<!--         VIEW PACKAGE         -->
<!---------------------------------->

<!-- AxialViewer -->
<template id="axial-viewer-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_viewer-holder">
        <slot id="slot" name="axial-views"></div>
    </div>
</template>

<!-- AxialView -->
<template id="axial-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_view-holder">
        <slot id="slot" name="axial-content"></div>
    </div>
</template>

<!-- AxialModuleView -->
<template id="axial-module-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_view-holder">
        <div class="axial_module_view-header">
            <div id="title" class="axial_module_view-title">Notifications</div>
        </div>
        <div class="axial_module_view-content axial_module_view-content-nopad axial_module_view-content-transparent">
            <slot id="contentSlot" name="axial-content"></slot>
        </div>
    </div>
</template>

<!-- AxialViewerIndicatorStep -->
<template id="axial-viewer-indicator-step-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_viewer_indicator_step-holder">
        <div class="axial_viewer_indicator_step-content">
            <div id="badge" class="axial_viewer_indicator_step-badge"></div>
            <div id="label" class="axial_viewer_indicator_step-label"></div>
        </div>
    </div>
</template>

<!-- AxialViewerIndicator -->
<template id="axial-viewer-indicator-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_viewer_indicator-holder">
        
    </div>
    <div id="bar" class="axial_viewer_indicator-bar"></div>
</template>

<!-- AxialTabButton -->
<template id="axial-tab-button-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_tab_button-background"></div>
    <div id="foreground" class="axial_tab_button-foreground"></div>
    <div id="content" class="axial_tab_button-content">
        <div id="icon" class="axial_button-icon">
            <slot id="iconSlot" name="axial-icon"></slot>
        </div>
        <div id="label" class="axial_tab_button-label"></div>
    </div>
</template>

<!-- AxialTabToggle -->
<template id="axial-tab-toggle-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_tab_button-background"></div>
    <div id="foreground" class="axial_tab_button-foreground"></div>
    <div id="content" class="axial_tab_button-content">
        <div id="icon" class="axial_toggle_button-icon">
            <slot id="iconSlot" name="axial-icon"></slot>
        </div>
        <div id="iconToggle" class="axial_toggle_button-icontoggle">
            <slot id="iconToggleSlot" name="axial-icon-toggle"></slot>
        </div>
        <div id="label" class="axial_tab_button-label"></div>
    </div>
    <div id="dropleft" class="axial_tab_toggle-dropleft"></div>
    <div id="dropright" class="axial_tab_toggle-dropright"></div>
</template>

<!-- AxialTabBar -->
<template id="axial-tab-bar-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_toggle_button_group-holder">
        <slot id="slot" name="axial-toggles"></slot>
    </div>
    <div id="indicator" class="axial_tab_bar-indicator"></div>
</template>

<!-- AxialTabViewer -->
<template id="axial-tab-viewer-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_tab_viewer-holder">
        <div id="header" class="axial_tab_viewer-header">
            <slot id="headerSlot" name="axial-header"></slot>
        </div>
        <div id="main" class="axial_tab_viewer-main">
            <div id="tabsHolder" class="axial_tab_viewer-tabsholder">
                <axial-tab-bar id="tabs" class="axial_tab_viewer-tabs">
                    <slot id="slotTabs" name="axial-tab-toggles" slot="axial-toggles"></slot>
                </axial-tab-bar>
                <axial-tab-button id="addTabButton" class="axial_tab_viewer-addtab">
                    <i slot="axial-icon" class="axial_tab_button-icon fa-solid fa-plus"></i>
                </axial-tab-button>
            </div>
            <axial-viewer id="viewer" class="axial_tab_viewer-viewer">
                <slot id="slotViews" name="axial-tab-views" slot="axial-views"></slot>
            </axial-viewer>
        </div>
        <div id="footer" class="axial_tab_viewer-footer">
            <slot id="footerSlot" name="axial-footer"></slot>
        </div>
    </div>
</template>

<!-- AxialTabBarContext -->
<template id="axial-tab-bar-context-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="group" class="axial_list_overlay-group">
        <axial-list-overlay-button axial-text="Supprimer l'onglet"></axial-list-overlay-button>
    </div>
</template>
