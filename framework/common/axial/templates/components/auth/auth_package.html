<!--         AUTH PACKAGE         -->
<!---------------------------------->

<!-- ./auth/AxialAuthBox -->
<template id="axial-auth-box-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="loadingState" class="axial_auth_box-loading">
        <axial-progress-indicator id="indicator"></axial-progress-indicator>
    </div>
    <div id="connectedState" class="axial_auth_box-connected">
        <div class="axial_auth_box-texts">
            <div id="name" class="axial_auth_box-name">Name</div>
            <div id="role" class="axial_auth_box-role">role</div>
        </div>
        <div id="photo" class="axial_auth_box-photo"></div>
    </div>
    <div id="signState" class="axial_auth_box-sign">
        <a id="signup" target="_self" class="axial_auth_box-signup" href="./account/register/">S'inscrire</a>
        <a id="signin" target="_self" href="./account/login/">
            <axial-button axial-text="Se connecter"></axial-button>
        </a>
    </div>
</template>

<!-- ./auth/AxialAuthLogin -->
<template id="axial-auth-login-template">
    <link rel="stylesheet" href="./styles.css">
    <form id="form" class="axial_auth_login-form" autocomplete="off">
        
        <div class="axial_auth_login-formitem">
            <label class="axial_auth_login-label" for="email">Email :</label>
            <input class="axial_auth_login-input" type="email" id="email" value="" required minlength="12" maxlength="60" autocomplete="email">
        </div>
        
        <div class="axial_auth_login-formitem">
            <label class="axial_auth_login-label" for="password">Mot de passe :</label>
            <div class="axial_auth_login-passholder">
                <input class="axial_auth_login-password" type="password" value="" id="password" required minlength="12" autocomplete="current-password">
                <axial-toggle-password-button id="toggle">
                    <div slot="axial-icon" class="axial_button-icon_holder">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">

                        </svg>
                    </div>
                    <div slot="axial-icon-toggle" class="axial_button-icon_holder">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512">
                            <path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zm151 118.3C226 97.7 269.5 80 320 80c65.2 0 118.8 29.6 159.9 67.7C518.4 183.5 545 226 558.6 256c-12.6 28-36.6 66.8-70.9 100.9l-53.8-42.2c9.1-17.6 14.2-37.5 14.2-58.7c0-70.7-57.3-128-128-128c-32.2 0-61.7 11.9-84.2 31.5l-46.1-36.1zM394.9 284.2l-81.5-63.9c4.2-8.5 6.6-18.2 6.6-28.3c0-5.5-.7-10.9-2-16c.7 0 1.3 0 2 0c44.2 0 80 35.8 80 80c0 9.9-1.8 19.4-5.1 28.2zm51.3 163.3l-41.9-33C378.8 425.4 350.7 432 320 432c-65.2 0-118.8-29.6-159.9-67.7C121.6 328.5 95 286 81.4 256c8.3-18.4 21.5-41.5 39.4-64.8L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5zm-88-69.3L302 334c-23.5-5.4-43.1-21.2-53.7-42.3l-56.1-44.2c-.2 2.8-.3 5.6-.3 8.5c0 70.7 57.3 128 128 128c13.3 0 26.1-2 38.2-5.8z"/>
                        </svg>
                    </div>
                </axial-toggle-password-button>
            </div>
        </div>
        <axial-service-button id="connectButton" axial-text="Se connecter" class="axial_auth_login-button"></axial-service-button>

        <div class="axial_auth_login-options">
            <a class="axial_auth_login-reset" href="../password/reset/" target="_self">Mot de passe oublié</a>
        </div>
        
        <axial-accordion-container id="messageContainer">
            <div slot="axial-content" class="axial_auth_login-message" id="message"></div>
        </axial-accordion-container>
        
        <div class="axial_auth_login-divider"></div>
        <div class="axial_auth_login-register">Pas encore de compte ? <a class="axial_auth_login-link" href="../register/" target="_self">S'inscrire</a></div>
    </form>
</template>

<!-- ./auth/AxialAuthVerifyer -->
<template id="axial-auth-verifyer-template">
    <link rel="stylesheet" href="./styles.css">
    <form id="form" class="axial_auth_verifyer-form" autocomplete="off">
        <div class="axial_auth_verifyer-question">Recevoir mon code par :</div>
        <axial-toggle-button-group id="group">
            <axial-toggle-radio slot="axial-toggles" axial-text="SMS" axial-value="sms"></axial-toggle-radio>
            <axial-toggle-radio slot="axial-toggles" axial-text="Email" axial-value="email"></axial-toggle-radio>
        </axial-toggle-button-group>

        <axial-service-button id="sendButton" axial-text="Recevoir mon code"></axial-service-button>

        <div class="axial_auth_verifyer-recipient" id="recipient"></div>
        
        <div class="axial_auth_verifyer-inputs" id="holder">
            <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_1" value="" required minlength="1" maxlength="1" autocomplete="off">
            <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_2" value="" required minlength="1" maxlength="1" autocomplete="off">
            <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_3" value="" required minlength="1" maxlength="1" autocomplete="off">
            <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_4" value="" required minlength="1" maxlength="1" autocomplete="off">
            <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_5" value="" required minlength="1" maxlength="1" autocomplete="off">
            <input class="axial_auth_verifyer-numinput" type="text" pattern="[0-9]" id="num_6" value="" required minlength="1" maxlength="1" autocomplete="off">
        </div>
        
        <div class="axial_auth_verifyer-divider"></div>
        
    </form>
</template>

<!-- AxialAuthRegisterAddress -->
<template id="axial-auth-register-address-template">
    <link rel="stylesheet" href="./styles.css">
    <form id="form" class="axial_auth_register-form" autocomplete="off">
        
        <div class="axial_auth_register-row">
            <div class="axial_auth_register-formitem">
                <label class="axial_auth_register-label" for="firstname">Prénom :</label>
                <input class="axial_auth_register-input" type="text" id="firstname" value="" required minlength="3" maxlength="60" autocomplete="name" placeholder="Jean">
                <accordion-container></accordion-container>
            </div>

            <div class="axial_auth_register-formitem">
                <label class="axial_auth_register-label" for="lastname">Nom :</label>
                <input class="axial_auth_register-input" type="text" id="lastname"  required minlength="3" maxlength="60" autocomplete="family-name" placeholder="Dupont">
                <accordion-container></accordion-container>
            </div>
        </div>
        
        <div class="axial_auth_register-row">
            <div class="axial_auth_register-formitem">
                <label class="axial_auth_register-label" for="email">Email :</label>
                <input class="axial_auth_register-input" type="email" id="email" value="" required minlength="8" maxlength="60" autocomplete="email" placeholder="mon.nom@site.com">
                <accordion-container></accordion-container>
            </div>

            <div class="axial_auth_register-formitem">
                <label class="axial_auth_register-label" for="phone">Mobile :</label>
                <input class="axial_auth_register-input" type="tel" id="phone" value="" required minlength="9" maxlength="12" autocomplete="tel" placeholder="0601234567">
                <accordion-container></accordion-container>
            </div>

        </div>

        <div class="axial_auth_register-formitem">
            <label class="axial_auth_register-label" for="address">Adresse :</label>
            <input class="axial_auth_register-input" type="text" id="address" required minlength="9" maxlength="200" autocomplete="address-line1" placeholder="1, rue de la Rénovation">
            <accordion-container></accordion-container>
        </div>

        <div class="axial_auth_register-row">

            <div class="axial_auth_register-formitem">
                <label class="axial_auth_register-label" for="zip">Code postal :</label>
                <input class="axial_auth_register-input" type="text" id="zip" required minlength="4" maxlength="5" autocomplete="postal-code" placeholder="30000">
                <accordion-container></accordion-container>
            </div>

            <div class="axial_auth_register-formitem">
                <label class="axial_auth_register-label" for="city">Ville :</label>
                <input class="axial_auth_register-input" type="text" id="city" required minlength="3" maxlength="60" autocomplete="" placeholder="Nîmes">
                <accordion-container></accordion-container>
            </div>
        </div>
        
        <div class="axial_auth_register-formitem">
            <label class="axial_auth_register-label"  for="password">Mot de passe :</label>
            
            <div class="axial_auth_register-passrow">
                <div class="axial_auth_register-passholder">
                    <input class="axial_auth_register-password" type="password"  id="password" required minlength="12" autocomplete="new-password">
                    <axial-toggle-password-button id="passwordToggle">
                        <div slot="axial-icon" class="axial_button-icon_holder">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">
                                <path d="M288 80c-65.2 0-118.8 29.6-159.9 67.7C89.6 183.5 63 226 49.4 256c13.6 30 40.2 72.5 78.6 108.3C169.2 402.4 222.8 432 288 432s118.8-29.6 159.9-67.7C486.4 328.5 513 286 526.6 256c-13.6-30-40.2-72.5-78.6-108.3C406.8 109.6 353.2 80 288 80zM95.4 112.6C142.5 68.8 207.2 32 288 32s145.5 36.8 192.6 80.6c46.8 43.5 78.1 95.4 93 131.1c3.3 7.9 3.3 16.7 0 24.6c-14.9 35.7-46.2 87.7-93 131.1C433.5 443.2 368.8 480 288 480s-145.5-36.8-192.6-80.6C48.6 356 17.3 304 2.5 268.3c-3.3-7.9-3.3-16.7 0-24.6C17.3 208 48.6 156 95.4 112.6zM288 336c44.2 0 80-35.8 80-80s-35.8-80-80-80c-.7 0-1.3 0-2 0c1.3 5.1 2 10.5 2 16c0 35.3-28.7 64-64 64c-5.5 0-10.9-.7-16-2c0 .7 0 1.3 0 2c0 44.2 35.8 80 80 80zm0-208a128 128 0 1 1 0 256 128 128 0 1 1 0-256z"/>
                            </svg>
                        </div>
                        <div slot="axial-icon-toggle" class="axial_button-icon_holder">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512">
                                <path d="M38.8 5.1C28.4-3.1 13.3-1.2 5.1 9.2S-1.2 34.7 9.2 42.9l592 464c10.4 8.2 25.5 6.3 33.7-4.1s6.3-25.5-4.1-33.7L525.6 386.7c39.6-40.6 66.4-86.1 79.9-118.4c3.3-7.9 3.3-16.7 0-24.6c-14.9-35.7-46.2-87.7-93-131.1C465.5 68.8 400.8 32 320 32c-68.2 0-125 26.3-169.3 60.8L38.8 5.1zm151 118.3C226 97.7 269.5 80 320 80c65.2 0 118.8 29.6 159.9 67.7C518.4 183.5 545 226 558.6 256c-12.6 28-36.6 66.8-70.9 100.9l-53.8-42.2c9.1-17.6 14.2-37.5 14.2-58.7c0-70.7-57.3-128-128-128c-32.2 0-61.7 11.9-84.2 31.5l-46.1-36.1zM394.9 284.2l-81.5-63.9c4.2-8.5 6.6-18.2 6.6-28.3c0-5.5-.7-10.9-2-16c.7 0 1.3 0 2 0c44.2 0 80 35.8 80 80c0 9.9-1.8 19.4-5.1 28.2zm51.3 163.3l-41.9-33C378.8 425.4 350.7 432 320 432c-65.2 0-118.8-29.6-159.9-67.7C121.6 328.5 95 286 81.4 256c8.3-18.4 21.5-41.5 39.4-64.8L83.1 161.5C60.3 191.2 44 220.8 34.5 243.7c-3.3 7.9-3.3 16.7 0 24.6c14.9 35.7 46.2 87.7 93 131.1C174.5 443.2 239.2 480 320 480c47.8 0 89.9-12.9 126.2-32.5zm-88-69.3L302 334c-23.5-5.4-43.1-21.2-53.7-42.3l-56.1-44.2c-.2 2.8-.3 5.6-.3 8.5c0 70.7 57.3 128 128 128c13.3 0 26.1-2 38.2-5.8z"/>
                            </svg>
                        </div>
                    </axial-toggle-password-button>
                </div>
                <axial-button id="generateButton" axial-text="Générer" class="axial_auth_register-generate"></axial-button>
            </div>
        </div>
        
        <div class="axial_auth_register-formitem">
            <axial-toggle-check id="legalToggle" axial-text="J'ai pris connaissance de la politique de confidentialité et des conditions générales de vente"></axial-toggle-check>
        </div>
        <div class="axial_auth_register-formitem">
            <axial-service-button id="createButton" axial-text="Créer mon compte" class="axial_auth_register-button"></axial-service-button>
        </div>
        
        <!--
        <div class="axial_auth_register-control">
            <div class="axial_auth_register-infotitle">Votre mot de passe doit contenir :</div>
            <div id="lowerPass" class="axial_auth_register-info">&bull; une minuscule</div>
            <div id="upperPass" class="axial_auth_register-info">&bull; une majuscule</div>
            <div id="numberPass" class="axial_auth_register-info">&bull; un chiffre</div>
            <div id="specialPass" class="axial_auth_register-info">&bull; un des ces caractères : ! ? # - _ @</div>
            <div id="countPass" class="axial_auth_register-info">&bull; 12 caractères minimum</div>
        </div>
        -->
        
        <div class="axial_auth_register-message" id="message"></div>
        <div class="axial_auth_register-divider"></div>
        <div class="axial_auth_register-login">Déjà enregistré ? <a class="axial_auth_register-link" href="../login" target="_self">Se connecter</a></div>
    </form>
</template>
