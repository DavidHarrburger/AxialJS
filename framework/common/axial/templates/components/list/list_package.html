<!---------------------------------->
<!--         LIST PACKAGE         -->
<!---------------------------------->

<!-- ./list/AxialList -->
<template id="axial-list-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_list-holder">
        <div id="header" class="axial_list-header">
            <slot id="headerSlot" name="axial-header"></slot>
        </div>
        <div id="content" class="axial_admin_list-content">
        </div>
        <div id="footer" class="axial_admin_list-footer">
            <slot id="footerSlot" name="axial-footer"></slot>
        </div>
    </div>
</template>

<!-- ./list/AxialListItem -->
<template id="axial-list-item-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_item-background">
        <div id="droptop" class="axial_list_item-droptop"></div>
        <div id="dropbottom" class="axial_list_item-dropbottom"></div>
    </div>
    <div id="content" class="axial_list_item-content">
        <div class="axial_spacer"></div>
        <div id="actions" class="axial_list_item-actions"></div>
    </div>
</template>

<!-- ./list/AxialListDivider -->
<template id="axial-list-divider-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_item-background">
        <div id="droptop" class="axial_list_item-droptop"></div>
        <div id="dropbottom" class="axial_list_item-dropbottom"></div>
    </div>
    <div id="content" class="axial_list_item-content axial_list_divider-content">
        <axial-input-base id="titleInput" class="axial_list_divider-title">DIVIDER</axial-input-base>
        <div class="axial_spacer"></div>
        <div id="actions" class="axial_list_item-actions">
            <axial-button id="trashButton" axial-theme="#000" class="axial_list_divider-button">
                <i slot="axial-icon" class="fa-color fa-solid fa-trash-can"></i>
            </axial-button>
            <axial-button id="gripButton" axial-theme="#000" class="axial_list_divider-button">
                <i slot="axial-icon" class="fa-color fa-solid fa-grip-vertical"></i>
            </axial-button>
        </div>
    </div>
</template>

<!-- ./list/AxialListAccordionElement -->
<template id="axial-list-accordion-element-template">
    <link rel="stylesheet" href="./styles.css">
    <axial-list-accordion-toggle id="toggle"></axial-list-accordion-toggle>
    <axial-accordion-container id="container">
        <slot id="slot" slot="axial-content" name="axial-content"></slot>
    </axial-accordion-container>
</template>

<!-- ./list/AxialListAccordionToggle -->
<template id="axial-list-accordion-toggle-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_accordion_toggle-background"></div>
    <div id="foreground" class="axial_list_accordion_toggle-foreground"></div>
    <div id="main" class="axial_list_accordion_toggle-main">
        <div id="content" class="axial_list_accordion_toggle-content">
            <div id="icon" class="axial_list_accordion_toggle-icon">
                <slot id="iconSlot" name="axial-icon"></slot>
            </div>
            <div id="iconToggle" class="axial_list_accordion_toggle-icontoggle">
                <slot id="iconToggleSlot" name="axial-icon-toggle"></slot>
            </div>
            <div id="label" class="axial_list_accordion_toggle-label"></div>
        </div>
        <div id="arrow" class="axial_list_accordion_toggle-arrow">
            <i class="fa-solid fa-chevron-right" style="color: #fff;"></i>
        </div>
    </div>
</template>
