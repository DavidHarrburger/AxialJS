<!-- AxialFormItemUploader -->
<template id="axial-form-item-uploader-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_form_item-holder">
        <div class="axial_form_item-header">
            <div id="label" class="axial_form_item-label">Label</div>
            <div id="action" class="axial_form_item-action">
                <slot id="actionSlot" name="axial-action"></slot>
            </div>
        </div>
        <div id="info" class="axial_form_item-info">
            <slot id="infoSlot" name="axial-info"></slot>
        </div>
        <div id="content" class="axial_form_item-content">
            <axial-file-uploader id="uploader"></axial-file-uploader>
        </div>
    </div>
</template>
