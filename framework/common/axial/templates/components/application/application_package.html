<!-- AxialArchiveOverlay -->
<template id="axial-archive-overlay-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_archive_overlay-holder">
        <div class="axial_archive_overlay-header">
            
            <div class="axial_archive_overlay-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"/>
                </svg>
            </div>
            
            <div class="axial_archive_overlay-title">Attention</div>
        </div>
        <div class="axial_archive_overlay-content">
            L'archivage des données rend les données invisibles mais ne les suprrime pas. <span class="ax_bo">Vous ne pourrez plus y accéder.</span><br><br>
            Contactez le support pour récupérer ces données.
        </div>
        <div class="axial_archive_overlay-actions">
            <axial-button id="cancel" axial-text="Annuler" axial-theme="#232323" axial-color="#ffffff">
                <i slot="axial-icon" class="fa-color fa-solid fa-arrow-left"></i>
            </axial-button>
            <axial-button id="confirm" axial-text="Archiver">
                <i slot="axial-icon" class="fa-color fa-solid fa-box-archive"></i>
            </axial-button>
        </div>
    </div>
</template>
