<!-- AxialOnboardingViewProfile -->
<template id="axial-onboarding-view-profile-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_view-holder">
        <div class="axial_onboarding_view-holder">
            <div class="axial_onboarding-title">Profil</div>
            
            <div class="axial_onboarding_profile-holder">
                <div id="banner" class="axial_onboarding_profile-banner">
                    <!--
                    <svg xmlns="http://www.w3.org/2000/svg" class="axial_onboarding_profile-banner_svg" width="100%" height="160">
                        <rect class="axial_onboarding_profile-banner_rect" x="0" y="0" rx="16" />
                    </svg>
                    -->
                    <label for="bannerInput" class="axial_onboarding_profile-banner_label">
                        <div class="axial_onboarding_profile-banner_info">Cliquer ou glisser / déposer une image</div>
                        <input type="file" id="bannerInput" name="bannerInput" class="axial_onboarding_profile-banner_input">
                    </label>
                </div>
                <div id="userpic" class="axial_onboarding_profile-userpic">
                    <label for="userpicInput" class="axial_onboarding_profile-userpic_label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera preview-icon"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
                        <input type="file" id="userpicInput" name="userpicInput" class="axial_onboarding_profile-userpic_input">
                    </label>
                </div>
            </div>
    
            <div class="axial_onboarding-group axial_onboarding_profile-group">
                <div class="axial_onboarding-item">
                    <label for="firstInput">Votre prénom :</label>
                    <input name="firstInput" id="firstInput" type="text" autocomplete="off" minlength="3" maxlength="60" required placeholder="Jean">
                </div>
                <div class="axial_onboarding-item">
                    <label for="lastInput">Votre nom :</label>
                    <input name="lastInput" id="lastInput" type="text" autocomplete="off" minlength="3" maxlength="60" required placeholder="Dupont">
                </div>
            </div>
            <div class="axial_spacer"></div>
            <div class="axial_onboarding_actions-row">
                <axial-service-button id="nextButton" axial-text="Continuer" class="axial_onboarding-next"></axial-service-button>
            </div>
        </div>
    </div>
</template>
