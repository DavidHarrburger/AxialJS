<!-- AxialOnboardingViewStart -->
<template id="axial-onboarding-view-start-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_view-holder">
        <div class="axial_onboarding_view-holder">
            <div class="axial_onboarding-title">Bienvenue</div>
            <div class="axial_onboarding-text">Vous êtes à quelques instants d'une vie meilleure !</div>
            <div class="axial_onboarding-text">Avant de créer votre compte, merci de prendre connaissance de nos mentions légales, conditions générales d'utilisation et politique de confidentialité.</div>
    
            <div class="axial_onboarding-group">
                <div class="axial_onboarding-item">
                    <axial-toggle-check id="legalCheck" axial-text="J'ai pris connaissances des mentions légales, des conditions générales d'utilisation et de la politique de confidentialité."></axial-toggle-check>
                </div>
            </div>
            <div class="axial_spacer"></div>
            <div class="axial_onboarding_actions-row">
                <axial-service-button id="nextButton" axial-text="Continuer" class="axial_onboarding-next"></axial-service-button>
            </div>
        </div>
    </div>
</template>
