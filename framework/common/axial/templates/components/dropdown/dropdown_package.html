<!---------------------------------->
<!--      DROPDOWN PACKAGE        -->
<!---------------------------------->

<!-- AxialDropdown -->
<template id="axial-dropdown-template">
    <link rel="stylesheet" href="./styles.css">
    <axial-toggle-button id="toggle" axial-text="Select"></axial-toggle-button>
    <div id="holder" class="axial_dropdown-holder">
        <div id="content" class="axial_dropdown-content">
            <slot id="slot" name="axial-slot"></slot>
        </div>
    </div>
</template>

<!-- AxialDropdownCalendar -->
<template id="axial-dropdown-calendar-template">
    <link rel="stylesheet" href="./styles.css">
    <axial-toggle-button id="toggle" axial-text="Select"></axial-toggle-button>
    <div id="holder" class="axial_dropdown-holder">
        <div id="content" class="axial_dropdown-content">
            <axial-calendar id="calendar"></axial-calendar>
        </div>
    </div>
</template>

<!-- AxialDropdownList -->
<template id="axial-dropdown-list-template">
    <link rel="stylesheet" href="./styles.css">
    <axial-toggle-button id="toggle" axial-text="Select"></axial-toggle-button>
    <div id="holder" class="axial_dropdown-holder">
        <div id="content" class="axial_dropdown-content">
            <axial-toggle-button-group-base id="group" class="axial_dropdown_list-group">
                <slot id="group" name="axial-slot"></slot>
            </axial-toggle-button-group-base>
        </div>
    </div>
</template>

<!-- AxialDropdownToggle -->
<template id="axial-dropdown-toggle-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_dropdown_toggle-background"></div>
    <div id="foreground" class="axial_dropdown_toggle-foreground"></div>
    <div id="content" class="axial_dropdown_toggle-content">
        <div id="icon" class="axial_dropdown_toggle-icon">
            <div id="check" class="axial_dropdown_toggle-check">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <path d="M256 48a208 208 0 1 1 0 416 208 208 0 1 1 0-416zm0 464A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-111 111-47-47c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l64 64c9.4 9.4 24.6 9.4 33.9 0L369 209z"/>
                </svg>
            </div>
        </div>
        <div id="label" class="axial_dropdown_toggle-label"></div>
    </div>
</template>
