<!-- AxialListOverlay -->
<template id="axial-list-overlay-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="group" class="axial_list_overlay-group"></div>
</template>

<!-- AxialListOverlayButton -->
<template id="axial-list-overlay-button-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_overlay_button-background"></div>
    <div id="foreground" class="axial_button-foreground"></div>
    <div id="content" class="axial_button-content">
        <div id="icon" class="axial_button-icon">
            <slot id="iconSlot" name="axial-icon"></slot>
        </div>
        <div id="label" class="axial_list_overlay_button-label"></div>
    </div>
</template>

<!-- AxialListOverlayButtonCaller -->
<template id="axial-list-overlay-button-caller-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_button-background"></div>
    <div id="foreground" class="axial_button-foreground"></div>
    <div id="content" class="axial_button-content">
        <div id="icon" class="axial_button-icon">
            <slot id="iconSlot" name="axial-icon"></slot>
        </div>
        <div id="label" class="axial_button-label"></div>
    </div>
</template>
