<!-- AxialSimulatorStepData -->
<template id="axial-simulator-step-data-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_simulator_step-holder">
        <div class="axial_simulator_step-content">
            <div id="title" class="axial_simulator_step-title"></div>
            <p id="info" class="axial_simulator_step-p axial_simulator_step-info"></p>
            <!--<p id="warning" class="axial_project_step-p axial_project_step-warning"></p>-->
            <div id="simulatorHolder" class="axial_simulator_step-data"></div>
            
        </div>
        <div class="axial_simulator_step-footer">
            <axial-button id="previous" axial-text="Etape précédente" class="axial_simulator_step-previous"></axial-button>
            <div class="axial_spacer"></div>
            <axial-button id="next" axial-text="Etape suivante" class="axial_simulator_step-next"></axial-button>
        </div>
    </div>
</template>
