<!-- AxialSimulatorStepSelection -->
<template id="axial-simulator-step-selection-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_simulator_step-holder">
        <div class="axial_simulator_step-content">
            <div id="title" class="axial_simulator_step-title">Vos travaux</div>
            <p class="axial_simulator_step-p">Sélectionnez ci-dessous les travaux que vous souhaiteriez réaliser.</p>
            <div id="selectionGroup" class="axial_simulator_step-column" ></div>
            
        </div>
        <div class="axial_simulator_step-footer">
            <!--<axial-button id="previous" axial-text="Etape précédente" class="axial_simulator_step-previous"></axial-button>-->
            <div class="axial_spacer"></div>
            <axial-button id="next" axial-text="Etape suivante" class="axial_simulator_step-next"></axial-button>
        </div>
    </div>
</template>
