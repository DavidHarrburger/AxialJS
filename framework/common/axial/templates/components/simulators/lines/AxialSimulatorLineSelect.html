<!-- AxialSimulatorLineSelect -->
<template id="axial-simulator-line-select-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_simulator_line-holder">
        <div class="axial_simulator_line-left">
            <div id="label" class="axial_simulator_line-label"></div>
            <div id="info" class="axial_simulator_line-info">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            </div>
        </div>
        <select name="list" id="select" class="axial_simulator_line_select"></select>
        <div id="actions" class="axial_simulator_line-actions">
            <axial-icon-button id="plusButton" axial-icon-name="plus" class="axial_simulator_line-plus"></axial-icon-button>
            <axial-icon-button id="trashButton" axial-icon-name="trash" class="axial_simulator_line-trash"></axial-icon-button>
        </div>
    </div>
</template>
