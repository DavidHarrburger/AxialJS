<!-- AxialSimulatorLineDim -->
<template id="axial-simulator-line-dim-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_simulator_line-holder">
        <div class="axial_simulator_line-left">
            <div id="label" class="axial_simulator_line-label"></div>
            <div id="info" class="axial_simulator_line-info">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            </div>
        </div>
        <div class="axial_simulator_line_dim-inputs">
            <div class="axial_simulator_line_dim-block">
                <label id="lenLabel" for="lenInput" class="axial_simulator_line-desc">Longueur :</label>
                <input id="lenInput" type="number" min="0" class="axial_simulator_line-input" placeholder="0">
            </div>
            <div class="axial_simulator_line_dim-block">
                <label id="widLabel" for="widInput" class="axial_simulator_line-desc">Largeur :</label>
                <input id="widInput" type="number" min="0" class="axial_simulator_line-input" placeholder="0">
            </div>
        </div>
        <axial-button id="deleteButton" class="axial_simulator_line_dim-delete">
            <svg xmlns="http://www.w3.org/2000/svg" slot="axial-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </axial-button>
    </div>
</template>
