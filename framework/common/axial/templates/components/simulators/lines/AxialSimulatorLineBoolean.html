<!-- AxialSimulatorLineBoolean -->
<template id="axial-simulator-line-boolean-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_simulator_line-holder">
        <div id="label" class="axial_simulator_line-label"></div>
        <axial-toggle-button-group id="group">
            <axial-toggle-radio id="yes" slot="axial-toggles" axial-text="Oui"></axial-toggle-radio>
            <axial-toggle-radio id="no" slot="axial-toggles" axial-text="Non"></axial-toggle-radio>
        </axial-toggle-button-group>
    </div>
</template>
