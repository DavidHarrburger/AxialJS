<!-- AxialSimulatorBlock -->
<template id="axial-simulator-block-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_simulator_block-header">
        <axial-toggle-switch id="switch" class="axial_simulator_block-switch"></axial-toggle-switch>
        <div id="title" class="axial_simulator_block-title">Block Title</div>
        <div id="info" class="axial_simulator_block-info">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </div>
        <div class="axial_spacer"></div>
        <axial-button id="addButton" axial-text="Ajouter" class="axial_simulator_block-add"></axial-button>
    </div>
    <div id="linesHolder" class="axial_simulator_block-holder"></div>
</template>
