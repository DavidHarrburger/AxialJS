<!-- AxialQuoteItem -->
<template id="axial-quote-item-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_quote_item-holder">
        <div class="axial_quote_item-left">
            <div id="num" class="axial_quote_item-num"></div>
            <div id="designation" class="axial_quote_item-designation"></div>
        </div>
        <div class="axial_quote_item-right">
            <div id="quantity" class="axial_quote_item-quantity"></div>
            <div id="unit" class="axial_quote_item-unit"></div>
            <div id="priceUnit" class="axial_quote_item-price_unit"></div>
            <div id="priceTotal" class="axial_quote_item-price_total"></div>
            <div id="tax" class="axial_quote_item-tax"></div>
            <div id="priceTotalTax" class="axial_quote_item-price_total_tax">Total T.T.C.</div>
        </div>

    </div>
</template>
