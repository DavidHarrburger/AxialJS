<!-- AxialModuleOboardingContactOverlay -->
<template id="axial-module-onboarding-contact-overlay-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_module_onboarding_contact_overlay-holder">

        <div class="axial_module_onboarding_contact_overlay-header">
            <div class="axial_module_onboarding_contact_overlay-title">Envoyer un SMS de contact</div>
        </div>

        <div class="axial_module_onboarding_contact_overlay-content" slot="axial-content">
            <div class="axial_module_onboarding_contact_overlay-inputs">
                <div class="axial_module_onboarding_contact_overlay-dual">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n0" min="0" max="0" required autocomplete="off" >
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n1" min="6" max="7" required autocomplete="off" >
                </div>
                <div class="axial_module_onboarding_contact_overlay-dual">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n2" min="0" max="9" step="1" required autocomplete="off" >
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n3" min="0" max="9" step="1" required autocomplete="off">
                </div>
                <div class="axial_module_onboarding_contact_overlay-dual">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n4" min="0" max="9" step="1" required autocomplete="off">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n5" min="0" max="9" step="1" required autocomplete="off">
                </div>
                <div class="axial_module_onboarding_contact_overlay-dual">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n6" min="0" max="9" step="1" required autocomplete="off">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n7" min="0" max="9" step="1" required autocomplete="off">
                </div>
                <div class="axial_module_onboarding_contact_overlay-dual">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n8" min="0" max="9" step="1" required autocomplete="off">
                    <input class="axial_module_onboarding_contact_overlay-num" type="number" id="n9" min="0" max="9" step="1" required autocomplete="off">
                </div>
            </div>
        </div>
            
        <div class="axial_module_onboarding_contact_overlay-footer">
            <axial-button id="cancelButton" axial-text="Annuler" axial-theme="#232323" axial-color="#ffffff"></axial-button>
            <axial-service-button id="createButton" axial-text="Envoyer le SMS"></axial-service-button>
        </div>

    </div>
</template>
