<!-- AxialModuleMessagingView -->
<template id="axial-module-messaging-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_view-holder">
        <div class="axial_module_view-header">
            <div id="title" class="axial_module_view-title">Messagerie</div>
            <div class="axial_spacer"></div>
            <axial-button id="contactButton" axial-text="Contacts">
                <i slot="axial-icon" class="fa-color fa-regular fa-pen-to-square"></i>
            </axial-button>
        </div>
        <div class="axial_module_view-content axial_module_view-content-nopad axial_module_view-content-transparent">
            <axial-messaging id="messaging"></axial-messaging>
        </div>
    </div>
</template>
