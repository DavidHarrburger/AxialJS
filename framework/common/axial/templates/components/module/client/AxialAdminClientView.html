<!-- ./admin/_views/AxialAdminClientView -->
<template id="axial-admin-client-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_admin_view-holder">
        <div class="axial_admin_view-header">
            <div id="title" class="axial_admin_view-title">Clients</div>
            <div class="axial_spacer"></div>
            <axial-button id="addClientButton" axial-text="Ajouter un client">
                <svg xmlns="http://www.w3.org/2000/svg" slot="axial-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-plus-icon lucide-square-plus"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            </axial-button>
        </div>
        <div class="axial_admin_view-content">
            <axial-admin-list id="clientList">
                <div slot="axial-header" class="axial_admin_client_list_item-user">Nom</div>
                <div slot="axial-header" class="axial_admin_client_list_item-type">Type</div>
                <div slot="axial-header" class="axial_admin_client_list_item-email">Courriel</div>
                <div slot="axial-header" class="axial_admin_client_list_item-tel">Téléphone</div>
                <div slot="axial-header" class="axial_spacer"></div>
                <div slot="axial-header" class="axial_admin_list_item-actions"></div>
            </axial-admin-list>
        </div>
    </div>
</template>
