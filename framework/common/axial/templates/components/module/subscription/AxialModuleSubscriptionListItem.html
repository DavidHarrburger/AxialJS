<!-- AxialModuleSubscriptionListItem -->
<template id="axial-module-subscription-list-item-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_item-background">
        <div id="droptop" class="axial_list_item-droptop"></div>
        <div id="dropbottom" class="axial_list_item-dropbottom"></div>
    </div>
    <div class="axial_list_item-content">
        <div class="axial_list_item-primary">
            <div id="photo" class="axial_list_item-prop_photo"></div>
            <div id="name" class="axial_list_item-prop_name"></div>
        </div>
        <div class="axial_list_item-secondary">
            <div id="price" class="axial_list_item-prop_120"></div>
            <div id="recurrence" class="axial_list_item-prop_120"></div>
            <div id="state" class="axial_list_item-prop_120">
                <axial-toggle-switch id="switch"></axial-toggle-switch>
            </div>
            <div id="creation" class="axial_list_item-prop_120"></div>
        </div>
        
        <div class="axial_spacer"></div>
        <div id="actions" class="axial_list_item-actions">
            <!--
            <axial-icon-button id="editButton" axial-icon-name="edit" axial-tooltip-text="Modifier"></axial-icon-button>
            <axial-icon-list-button-project id="projectButton"></axial-icon-list-button-project>
            -->
        </div>
    </div>
</template>
