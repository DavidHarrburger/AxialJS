<!-- AxialModuleSubscriptionView -->
<template id="axial-module-subscription-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_view-holder">
        <div class="axial_module_view-header">
            <div id="title" class="axial_module_view-title">Abonnements</div>
            <div class="axial_spacer"></div>
            <div class="axial_module_view-actions">
                <axial-button id="addButton" axial-text="Créer un abonnement">
                    <svg xmlns="http://www.w3.org/2000/svg" slot="axial-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-plus-icon lucide-square-plus"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                </axial-button>
            </div>
            <axial-icon-button id="ellipsisButton" axial-icon-name="ellipsis" class="axial_module_view-ellipsis"></axial-icon-button>
        </div>
        <div class="axial_module_view-content axial_module_view-content-transparent">
            <slot id="contentSlot" name="axial-content"></slot>
            <axial-list id="list">
                <div slot="axial-header" class="axial_list_item-prop_photo_empty"></div>
                <div slot="axial-header" class="axial_list_item-prop_name">Abonnement</div>
                <div slot="axial-header" class="axial_list_item-prop_100">Prix</div>
                <div slot="axial-header" class="axial_list_item-prop_100">Récurrence</div>
                <div slot="axial-header" class="axial_list_item-prop_100">Actif</div>
                <div slot="axial-header" class="axial_list_item-prop_100">Creation</div>
                <div slot="axial-header" class="axial_spacer"></div>
                <div slot="axial-header" class="axial_admin_list_item-actions"></div>
            </axial-list>
        </div>
    </div>
</template>
