<!-- AxialModuleSearchPopup -->
<template id="axial-module-search-popup-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_popup-holder">
        <div class="axial_module_popup-header">
            <div id="title" class="axial_module_popup-title">Recherche</div>
            <div class="axial_spacer"></div>
            <axial-button id="closer" axial-text="Fermer"></axial-button>
        </div>
        <div class="axial_module_popup-content">
            <slot id="contentSlot" name="axial-content"></slot>
            <div class="axial_module_globals-row">
                <input id="searchInput" type="text" placeholder="Recherche" class="axial_list-search_full">
            </div>
            
            <axial-list id="list">
                <!--<div slot="axial-header" class="axial_module_project_item-name">Nom du projet</div>-->
            </axial-list>
        </div>
    </div>
</template>
