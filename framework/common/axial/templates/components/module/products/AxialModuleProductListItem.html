<!-- AxialModuleProductListItem -->
<template id="axial-module-product-list-item-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_item-background">
        <div id="droptop" class="axial_list_item-droptop"></div>
        <div id="dropbottom" class="axial_list_item-dropbottom"></div>
    </div>
    <div class="axial_list_item-content">
        <div id="name"     class="axial_list_item-prop_name"></div>
        <!--<div id="ref"      class="axial_list_item-prop axial_list_item-prop_100"></div>-->
        <!--<div id="kind"     class="axial_list_item-prop axial_list_item-prop_100"></div>-->
        <div id="price"    class="axial_list_item-prop axial_list_item-prop_100"></div>
        <div id="unit"     class="axial_list_item-prop axial_list_item-prop_100"></div>
        <div id="tax"      class="axial_list_item-prop axial_list_item-prop_100"></div>
        <div id="created"  class="axial_list_item-prop axial_list_item-prop_120"></div>
        <div id="modified" class="axial_list_item-prop axial_list_item-prop_120"></div>
        <div class="axial_spacer"></div>
        <div id="actions" class="axial_list_item-actions">
            <axial-icon-button id="editButton" axial-icon-name="edit" axial-tooltip-text="Modifier"></axial-icon-button>
        </div>
    </div>
</template>
