<!-- .AxialModuleHomeAdminView -->
<template id="axial-module-home-admin-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_view-holder">
        <div class="axial_module_view-header">
            <div id="title" class="axial_module_view-title">Accueil</div>
            <div class="axial_spacer"></div>
            <axial-button id="mainButton" axial-text="Contact express">
                <svg slot="axial-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send-icon lucide-send"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
            </axial-button>
        </div>
        <div class="axial_module_view-content axial_module_view-content-transparent">
            <slot id="contentSlot" name="axial-content"></slot>
            <axial-card-displayer axial-grid-trow="repeat(2,1fr)" axial-grid-tcol="repeat(2,1fr)">
                <axial-card slot="axial-grid" axial-grid-row="1" axial-grid-col="1"></axial-card>
                <axial-card slot="axial-grid" axial-grid-row="1" axial-grid-col="2"></axial-card>
                <axial-card slot="axial-grid" axial-grid-row="2" axial-grid-col="1"></axial-card>
                <axial-card-uploader slot="axial-grid" axial-grid-row="2" axial-grid-col="2"></axial-card-uploader>
            </axial-card-displayer>
        </div>
    </div>
</template>
