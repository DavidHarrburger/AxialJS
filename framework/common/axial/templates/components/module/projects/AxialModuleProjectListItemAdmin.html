<!-- AxialModuleProjectListItemAdmin -->
<template id="axial-module-project-list-item-admin-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_item-background">
        <div id="droptop" class="axial_list_item-droptop"></div>
        <div id="dropbottom" class="axial_list_item-dropbottom"></div>
    </div>
    <div id="content" class="axial_list_item-content">
        <div id="name" class="axial_list_item-prop_name"></div>
        <div class="axial_spacer"></div>
        <div id="actions" class="axial_list_item-actions">
            <axial-icon-button id="visualizeButton" axial-icon-name="eye" axial-tooltip-text="Voir l'estimation"></axial-icon-button>
            <axial-icon-list-button-clone id="cloneButton"></axial-icon-list-button-clone>
            <!--
            <axial-icon-list-button-archive id="archiveButton"></axial-icon-list-button-archive>
            <axial-icon-list-button-delete id="deleteButton"></axial-icon-list-button-delete>
            -->
            <axial-icon-button id="editButton" axial-icon-name="edit" axial-tooltip-text="Modifier"></axial-icon-button>
            <axial-icon-list-button-lock id="lockButton"></axial-icon-list-button-lock>
        </div>
    </div>
</template>
