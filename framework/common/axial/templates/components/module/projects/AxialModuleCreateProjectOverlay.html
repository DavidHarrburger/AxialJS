<!-- AxialModuleCreateProjectOverlay -->
<template id="axial-module-create-project-overlay-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_create_project_overlay-holder">
        <div class="axial_module_create_project_overlay-header">
            <div class="axial_module_create_project_overlay-title">Créer un nouveau projet</div>
        </div>
        <div style="font-weight: 600;">
            Postes disponibles:
            <div id="itemNamesHolder" style="font-size: 14px;"></div>
        </div>
        <div class="axial_module_create_project_overlay-content">
            <div class="axial_module_create_project_overlay-item">
                <label for="name">Entrez le nom du projet <span class="axial_mandatory">*</span></label>
                <input id="projectNameInput" name="name" type="text" required minlength="3" maxlength="64" autocomplete="off">
                <div class="axial_input_legend">Entre 3 et 64 caractères</div>
            </div>
            <!--
            <div class="axial_module_create_project_overlay-item">
                <label for="simulation">Entrez le nom de votre estimation <span class="axial_mandatory">*</span></label>
                <div class="axial_input_info">Un projet peut contenir plusieurs estimations ou variantes</div>
                <input id="simulationNameInput" name="simulation" type="text" required minlength="3" maxlength="64" autocomplete="off">
                <div class="axial_input_legend">Entre 3 et 64 caractères</div>
            </div>
            
            <div class="axial_module_create_project_overlay-item axial_module_create_project_overlay-check">
                <axial-toggle-check axial-text="Ouvrir le projet après création" id="toggleCheck"></axial-toggle-check>
            </div>
            -->
        </div>
        <div class="axial_module_create_project_overlay-footer">
            <axial-button id="cancelButton" axial-text="Annuler" axial-theme="#232323" axial-color="#ffffff" class="axial_module_create_project_overlay-button"></axial-button>
            <axial-service-button id="createButton" axial-text="Créer le projet" class="axial_module_create_project_overlay-button"></axial-service-button>
        </div>
    </div>
</template>
