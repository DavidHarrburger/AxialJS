<!-- .AxialModuleUserView -->
<template id="axial-module-user-view-template">
    <link rel="stylesheet" href="./styles.css">
    <div class="axial_module_view-holder">
        <div class="axial_module_view-header">
            <div id="title" class="axial_module_view-title">Clients</div>
            <div class="axial_spacer"></div>
            <div class="axial_module_view-actions">
                <input id="searchInput" type="text" placeholder="Rechercher un client" class="axial_list-search">
                <axial-button id="addButton" axial-text="Créer un client">
                    <svg xmlns="http://www.w3.org/2000/svg" slot="axial-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-plus-icon lucide-square-plus"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                </axial-button>
            </div>
            <axial-icon-button id="ellipsisButton" axial-icon-name="ellipsis" class="axial_module_view-ellipsis"></axial-icon-button>
        </div>
        <div class="axial_module_view-content axial_module_view-content-transparent">
            <slot id="contentSlot" name="axial-content"></slot>
            <axial-list id="list">
                <div slot="axial-header" class="axial_list_item-prop_name">Nom</div>
                <div slot="axial-header" class="axial_list_item-prop_email">Email</div>
                <div slot="axial-header" class="axial_list_item-prop_tel">Téléphone</div>
                <div slot="axial-header" class="axial_list_item-prop_creation">Création</div>
                <div slot="axial-header" class="axial_list_item-prop_item">Projets</div>
            </axial-list>
        </div>
    </div>
</template>
