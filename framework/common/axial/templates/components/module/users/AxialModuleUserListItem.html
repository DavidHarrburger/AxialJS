<!-- AxialModuleUserListItem -->
<template id="axial-module-user-list-item-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="background" class="axial_list_item-background">
        <div id="droptop" class="axial_list_item-droptop"></div>
        <div id="dropbottom" class="axial_list_item-dropbottom"></div>
    </div>
    <div class="axial_list_item-content">
        <div id="name" class="axial_list_item-prop_name"></div>
        <div id="email" class="axial_list_item-prop_email"></div>
        <div id="tel" class="axial_list_item-prop_tel"></div>
        <div id="creation" class="axial_list_item-prop_creation"></div>
        <div id="projects" class="axial_list_item-prop_item"></div>
        <div class="axial_spacer"></div>
        <div id="actions" class="axial_list_item-actions">
            <axial-icon-button id="editButton" axial-icon-name="edit" axial-tooltip-text="Modifier"></axial-icon-button>
            <axial-icon-list-button-project id="projectButton"></axial-icon-list-button-project>
        </div>
    </div>
</template>
