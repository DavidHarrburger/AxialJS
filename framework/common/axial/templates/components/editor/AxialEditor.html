<!-- AxialEditor -->
<template id="axial-editor-template">
    <link rel="stylesheet" href="./styles.css">
    <div id="holder" class="axial_editor-holder">
        <div id="header" class="axial_editor-header">
            <axial-button id="addButton" axial-text="Ajouter un élément"></axial-button>
        </div>
        <div id="structure" class="axial_editor-structure"></div>
        <div id="main" class="axial_editor-main">
            <axial-editable-root id="root"></axial-editable-root>
        </div>
        <div id="properties" class="axial_editor-properties">
            <axial-counterpart id="rootCounterpart"></axial-counterpart>
        </div>
        <div id="footer" class="axial_editor-footer">
            
        </div>
    </div>
</template>
