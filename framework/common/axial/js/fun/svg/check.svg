<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" >
    <style>
        .bg    { opacity: 0; animation: fadeBg .25s ease forwards; }
        .ring  { stroke-dasharray: 314; stroke-dashoffset: 314; animation: drawRing .55s cubic-bezier(.34,1.56,.64,1) .12s forwards; }
        .check { stroke-dasharray: 70; stroke-dashoffset: 70; animation: drawCheck .4s cubic-bezier(.34,1.56,.64,1) .24s forwards; }

        @keyframes fadeBg
        {
            from { opacity: 0; transform: scale(.92); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes drawRing
        {
            from { stroke-dashoffset: 314; }
            to   { stroke-dashoffset: 0; }
        }

        @keyframes drawCheck
        {
            from { stroke-dashoffset: 70; }
            to   { stroke-dashoffset: 0;  }
        }
    </style>

    <circle
        class="bg"
        cx="60"
        cy="60"
        r="50"
        fill="#DDF5DD"
        transform-origin="60px 60px"
    />

    <circle
        class="ring"
        cx="60"
        cy="60"
        r="50"
        fill="none"
        stroke="#1E6B34"
        stroke-width="6"
        stroke-linecap="round"
    />

    <path
        class="check"
        d="M35 63 L52 80 L86 42"
        fill="none"
        stroke="#1E6B34"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
    />
</svg>